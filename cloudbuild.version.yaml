steps:
  # Step 1: Fetch the latest version number from Google Cloud Storage
  - name: gcr.io/cloud-builders/gsutil
    id: "fetch-version"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        VERSION_FILE="gs://school-build-logs/version.txt"
        if gsutil stat $VERSION_FILE; then
          CURRENT_VERSION=$(gsutil cat $VERSION_FILE)
          echo "Current Version: $CURRENT_VERSION"
        else
          CURRENT_VERSION="v1.0"
          echo "Version file not found. Setting initial version: $CURRENT_VERSION"
        fi

        # Increment version (assumes format vX.Y)
        NEW_VERSION=$(echo $CURRENT_VERSION | awk -F'.' '{print $1"."$2+1}')
        echo "New Version: $NEW_VERSION"
        echo "$NEW_VERSION" > /workspace/version.txt
