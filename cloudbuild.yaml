steps:
  # Step 1: Check out the repository (Cloud Build clones the source automatically)
  - name: gcr.io/cloud-builders/git
    entrypoint: "bash"
    args:
      - "-c"
      - |
        echo "Source code is already cloned by Cloud Build."
  
  # Step 2: Set up JDK (for Maven)
  - name: gcr.io/cloud-builders/mvn
    args:
      - clean
      - package

  # Step 3: Authenticate to Google Cloud
  - name: gcr.io/cloud-builders/gcloud
    args:
      - auth
      - configure-docker
      - asia-docker.pkg.dev
  
  # Step 4: Build the Docker image
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - "-t"
      - asia-docker.pkg.dev/$PROJECT_ID/school/sch:white
      - "."
  
  # Step 5: Push the Docker image
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - asia-docker.pkg.dev/$PROJECT_ID/school/sch:yellow

images:
  - asia-docker.pkg.dev/$PROJECT_ID/school/sch:yellow
