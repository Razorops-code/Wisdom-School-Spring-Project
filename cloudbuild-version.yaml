steps:
  # Step 1: Fetch the version from substitution variable (_NEW_VERSION)
  - name: gcr.io/cloud-builders/git
    id: "fetch-version"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        if [ -z "${_NEW_VERSION}" ]; then
          echo "Error: _NEW_VERSION is not set!"
          exit 1
        fi
        echo "Using version: ${_NEW_VERSION}"

logsBucket: gs://school-build-logs  # Option 1 (Use GCS logs)

# options:
#   logging: CLOUD_LOGGING_ONLY  # Option 2 (Use Cloud Logging)
