steps:
  # Step 1: Retrieve the latest version or initialize v1.0
  - name: gcr.io/cloud-builders/gcloud
    id: "get-version"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        if gsutil stat gs://school-build-logs/version.txt; then
          gsutil cp gs://school-build-logs/version.txt version.txt
          _NEW_VERSION=$(cat version.txt)
        else
          _NEW_VERSION="v1.0"
        fi
        echo "Previous Version: $_NEW_VERSION"

        # Extract major and minor versions
        major=$(echo $_NEW_VERSION | cut -d'.' -f1 | sed 's/v//')
        minor=$(echo $_NEW_VERSION | cut -d'.' -f2)

        # Increment minor version
        _NEW_VERSION="v${major}.$((minor + 1))"
        echo "New Version: $_NEW_VERSION"
        echo "$_NEW_VERSION" > version.txt

  # Step 2: Build the Maven project
  - name: gcr.io/cloud-builders/mvn
    args:
      - clean
      - package

  # Step 3: Authenticate Docker with Google Cloud
  - name: gcr.io/cloud-builders/gcloud
    args:
      - auth
      - configure-docker
      - asia-south1-docker.pkg.dev

  # Step 4: Build the Docker image with the new version tag
  - name: gcr.io/cloud-builders/docker
    id: "build-image"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        _NEW_VERSION=$(cat version.txt)
        docker build -t asia-south1-docker.pkg.dev/aqueous-cortex-445305-m6/newschool/sch:$_NEW_VERSION .

  # Step 5: Push the Docker image with the new version tag
  - name: gcr.io/cloud-builders/docker
    id: "push-image"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        _NEW_VERSION=$(cat version.txt)
        docker push asia-south1-docker.pkg.dev/aqueous-cortex-445305-m6/newschool/sch:$_NEW_VERSION

  # Step 6: Save the new version to a GCS bucket for the next build
  - name: gcr.io/cloud-builders/gsutil
    args: ["cp", "version.txt", "gs://school-build-logs/version.txt"]

images:
  - "asia-south1-docker.pkg.dev/aqueous-cortex-445305-m6/newschool/sch"

logsBucket: gs://school-build-logs

options:
  logging: CLOUD_LOGGING_ONLY

