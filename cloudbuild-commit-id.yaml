substitutions:
  _REPO: "asia-docker.pkg.dev/$(echo $_PROJECT_ID | tr '[:upper:]' '[:lower:]')/school/sch"

steps:
  # Step 1: Check out the repository (Cloud Build clones the source automatically)
  - name: gcr.io/cloud-builders/git
    entrypoint: "bash"
    args:
      - "-c"
      - |
        echo "Source code is already cloned by Cloud Build."
        git checkout $(git rev-parse --short=6 HEAD)  # Explicitly check out the commit

  # Step 2: Set up JDK (for Maven)
  - name: gcr.io/cloud-builders/mvn
    args:
      - clean
      - package

  # Step 3: Authenticate to Google Cloud
  - name: gcr.io/cloud-builders/gcloud
    args:
      - auth
      - configure-docker
      - asia-docker.pkg.dev

  # Step 4: Get the first 6 characters of the commit SHA and convert to lowercase
  - name: gcr.io/cloud-builders/git
    entrypoint: "bash"
    args:
      - "-c"
      - |
        COMMIT_SHA=$(git rev-parse --short=6 HEAD)
        COMMIT_SHA_LOWER=$(echo $COMMIT_SHA | tr '[:upper:]' '[:lower:]')  # Convert to lowercase
        echo "Commit SHA (first 6 chars, lowercase): $COMMIT_SHA_LOWER" > /workspace/commit_id.txt
        echo "COMMIT_SHA=$COMMIT_SHA_LOWER" > /workspace/commit_sha.env  # Save to file for next steps

  # Step 5: Build the Docker image (without tagging)
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - "-f"
      - "Dockerfile"
      - "-t"
      - "$_REPO:build"  # Use a temporary 'build' tag
      - "."

  # Step 6: Tag the Docker image with the commit SHA
  - name: gcr.io/cloud-builders/docker
    args:
      - tag
      - "$_REPO:build"
      - "$_REPO:${COMMIT_SHA_LOWER}"  # Tag with commit SHA (from previous step)

  # Step 7: Push the Docker image with the lowercase commit SHA tag
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - "$_REPO:${COMMIT_SHA_LOWER}"

logsBucket: gs://school-build-logs

options:
  logging: GCS_ONLY
